# ── SonarQube Project Configuration ─────────────────────────────────────────
# This file is read by sonar-scanner when run from the project root.
# The token is NOT stored here — it comes from Jenkins via withSonarQubeEnv().

sonar.projectKey=cloud-devops-lab-26
sonar.projectName=Cloud DevOps Lab 26 — Expenses Tracker
sonar.projectVersion=1.0

# ── Source code paths ────────────────────────────────────────────────────────
# Analyse both client (React) and server (Node.js)
sonar.sources=app/client/src,app/server/src,app/server/server.js

# Exclude build artifacts, node_modules, and generated files
sonar.exclusions=\
    **/node_modules/**,\
    **/dist/**,\
    **/.git/**,\
    **/coverage/**,\
    **/*.test.js,\
    **/*.spec.js

# ── Language settings ─────────────────────────────────────────────────────────
sonar.language=js
sonar.javascript.lcov.reportPaths=app/client/coverage/lcov.info

# ── Encoding ──────────────────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8
