<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A simple personal expenses tracker for students" />
  <title>💰 Student Expenses Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ── Header ──────────────────────────── -->
  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">💰</span>
        <h1>Student Expenses Tracker</h1>
      </div>
      <div id="total-badge" class="total-badge">Total: $0.00</div>
    </div>
  </header>

  <main class="container">

    <!-- ── Summary Cards ───────────────────── -->
    <section class="summary-grid" id="summary-grid">
      <div class="summary-card" id="card-total">
        <span class="card-label">Total Spent</span>
        <span class="card-value" id="stat-total">$0.00</span>
      </div>
      <div class="summary-card" id="card-count">
        <span class="card-label">Transactions</span>
        <span class="card-value" id="stat-count">0</span>
      </div>
      <div class="summary-card" id="card-top">
        <span class="card-label">Top Category</span>
        <span class="card-value" id="stat-top">—</span>
      </div>
    </section>

    <!-- ── Add Expense Form ─────────────────── -->
    <section class="card form-card">
      <h2 class="section-title">Add New Expense</h2>
      <form id="expense-form">
        <div class="form-row">
          <div class="form-group">
            <label for="title">Title <span class="required">*</span></label>
            <input type="text" id="title" name="title" placeholder="e.g. Lunch at cafeteria" required />
          </div>
          <div class="form-group">
            <label for="amount">Amount ($) <span class="required">*</span></label>
            <input type="number" id="amount" name="amount" placeholder="0.00" step="0.01" min="0.01" required />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category">
              <option value="General">General</option>
              <option value="Food">🍔 Food</option>
              <option value="Transport">🚌 Transport</option>
              <option value="Books">📚 Books</option>
              <option value="Stationery">✏️ Stationery</option>
              <option value="Entertainment">🎮 Entertainment</option>
              <option value="Health">💊 Health</option>
              <option value="Other">📦 Other</option>
            </select>
          </div>
          <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" name="date" />
          </div>
        </div>
        <div class="form-group">
          <label for="note">Note (optional)</label>
          <input type="text" id="note" name="note" placeholder="Any extra detail..." />
        </div>
        <button type="submit" class="btn btn-primary" id="submit-btn">
          <span>+ Add Expense</span>
        </button>
      </form>
    </section>

    <!-- ── Expenses List ──────────────────── -->
    <section class="card">
      <div class="list-header">
        <h2 class="section-title">All Expenses</h2>
        <input type="text" id="search" placeholder="🔍 Search expenses..." class="search-input" />
      </div>
      <div id="expenses-list" class="expenses-list">
        <div class="loading">Loading expenses...</div>
      </div>
    </section>

  </main>

  <!-- ── Edit Modal ─────────────────────── -->
  <div id="edit-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3>Edit Expense</h3>
        <button class="modal-close" id="close-modal">✕</button>
      </div>
      <form id="edit-form">
        <input type="hidden" id="edit-id" />
        <div class="form-row">
          <div class="form-group">
            <label for="edit-title">Title</label>
            <input type="text" id="edit-title" required />
          </div>
          <div class="form-group">
            <label for="edit-amount">Amount ($)</label>
            <input type="number" id="edit-amount" step="0.01" min="0.01" required />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="edit-category">Category</label>
            <select id="edit-category">
              <option value="General">General</option>
              <option value="Food">🍔 Food</option>
              <option value="Transport">🚌 Transport</option>
              <option value="Books">📚 Books</option>
              <option value="Stationery">✏️ Stationery</option>
              <option value="Entertainment">🎮 Entertainment</option>
              <option value="Health">💊 Health</option>
              <option value="Other">📦 Other</option>
            </select>
          </div>
          <div class="form-group">
            <label for="edit-date">Date</label>
            <input type="date" id="edit-date" />
          </div>
        </div>
        <div class="form-group">
          <label for="edit-note">Note</label>
          <input type="text" id="edit-note" />
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-ghost" id="cancel-edit">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ── Toast Notification ─────────────── -->
  <div id="toast" class="toast hidden"></div>

  <script src="js/app.js"></script>
</body>
</html>
