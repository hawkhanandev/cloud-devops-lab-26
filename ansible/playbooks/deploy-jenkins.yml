---
- name: Deploy Jenkins on AWS EC2
  hosts: jenkins_nodes
  become: true

  vars:
    jenkins_port: 8080

    jenkins_keyring: /etc/apt/keyrings/jenkins-keyring.asc
    docker_keyring: /etc/apt/keyrings/docker.asc

    sonar_scanner_version: "7.1.0.4889"
    sonar_scanner_dir: "/opt/sonar-scanner-{{ sonar_scanner_version }}-linux-x64"

  # ============================================================
  # PRE-TASKS
  # Clean old/broken Jenkins repository configuration
  # BEFORE running apt update
  # ============================================================

  pre_tasks:

    - name: Remove old Jenkins .list repository
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/jenkins.list
        state: absent

    - name: Remove old Jenkins .sources repository
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/jenkins.sources
        state: absent

    - name: Remove old Jenkins GPG key from /usr/share/keyrings
      ansible.builtin.file:
        path: /usr/share/keyrings/jenkins-keyring.gpg
        state: absent

    - name: Remove old Jenkins GPG key from /etc/apt/keyrings
      ansible.builtin.file:
        path: /etc/apt/keyrings/jenkins-keyring.gpg
        state: absent

    - name: Remove old Jenkins ASCII keyring
      ansible.builtin.file:
        path: /etc/apt/keyrings/jenkins-keyring.asc
        state: absent

    - name: Remove Jenkins repository entries from main sources.list
      ansible.builtin.lineinfile:
        path: /etc/apt/sources.list
        regexp: '.*pkg\.jenkins\.io.*'
        state: absent


  tasks:

    # ============================================================
    # 1. BASE PACKAGES
    # ============================================================

    - name: Update APT cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install required base packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - fontconfig
          - openjdk-21-jre
          - git
          - unzip
        state: present


    # ============================================================
    # 2. JENKINS REPOSITORY
    # ============================================================

    - name: Create APT keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Jenkins GPG key
      ansible.builtin.get_url:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
        dest: "{{ jenkins_keyring }}"
        mode: "0644"

    - name: Configure Jenkins APT repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by={{ jenkins_keyring }}] https://pkg.jenkins.io/debian-stable binary/"
        filename: jenkins
        state: present

    - name: Update APT cache after adding Jenkins repository
      ansible.builtin.apt:
        update_cache: true


    # ============================================================
    # 3. INSTALL JENKINS
    # ============================================================

    - name: Install Jenkins
      ansible.builtin.apt:
        name: jenkins
        state: present

    - name: Configure Jenkins HTTP port
      ansible.builtin.lineinfile:
        path: /etc/default/jenkins
        regexp: "^HTTP_PORT="
        line: "HTTP_PORT={{ jenkins_port }}"
      notify: Restart Jenkins

    - name: Enable and start Jenkins
      ansible.builtin.systemd:
        name: jenkins
        enabled: true
        state: started


    # ============================================================
    # 4. DOCKER REPOSITORY
    # ============================================================

    - name: Remove old Docker .list repository
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/docker.list
        state: absent

    - name: Remove old Docker .sources repository
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/docker.sources
        state: absent

    - name: Create Docker APT keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: "{{ docker_keyring }}"
        mode: "0644"

    - name: Configure Docker APT repository
      ansible.builtin.deb822_repository:
        name: docker
        types:
          - deb
        uris:
          - https://download.docker.com/linux/ubuntu
        suites:
          - "{{ ansible_distribution_release }}"
        components:
          - stable
        architectures:
          - amd64
        signed_by: "{{ docker_keyring }}"
        state: present

    - name: Update APT cache after adding Docker repository
      ansible.builtin.apt:
        update_cache: true


    # ============================================================
    # 5. INSTALL DOCKER
    # ============================================================

    - name: Install Docker Engine and plugins
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Enable and start Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Add Jenkins user to Docker group
      ansible.builtin.user:
        name: jenkins
        groups:
          - docker
        append: true

    - name: Reset Ansible connection after Docker group change
      ansible.builtin.meta: reset_connection


    # ============================================================
    # 6. VERIFY DOCKER
    # ============================================================

    - name: Check Docker version
      ansible.builtin.command:
        cmd: docker --version
      register: docker_version
      changed_when: false

    - name: Display Docker version
      ansible.builtin.debug:
        msg: "{{ docker_version.stdout }}"

    - name: Check Docker Compose version
      ansible.builtin.command:
        cmd: docker compose version
      register: compose_version
      changed_when: false

    - name: Display Docker Compose version
      ansible.builtin.debug:
        msg: "{{ compose_version.stdout }}"


    # ============================================================
    # 7. SONARQUBE SCANNER
    #
    # NOTE:
    # This installs ONLY the scanner.
    # SonarQube Server is on a separate EC2.
    # ============================================================

    - name: Download SonarQube Scanner
      ansible.builtin.get_url:
        url: "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-{{ sonar_scanner_version }}-linux-x64.zip"
        dest: /tmp/sonar-scanner.zip
        mode: "0644"

    - name: Extract SonarQube Scanner
      ansible.builtin.unarchive:
        src: /tmp/sonar-scanner.zip
        dest: /opt
        remote_src: true
        creates: "{{ sonar_scanner_dir }}"

    - name: Create SonarQube Scanner symlink
      ansible.builtin.file:
        src: "{{ sonar_scanner_dir }}/bin/sonar-scanner"
        dest: /usr/local/bin/sonar-scanner
        state: link
        force: true
        mode: "0755"

    - name: Verify SonarQube Scanner
      ansible.builtin.command:
        cmd: sonar-scanner --version
      register: sonar_scanner_output
      changed_when: false

    - name: Display SonarQube Scanner version
      ansible.builtin.debug:
        msg: "{{ sonar_scanner_output.stdout }}"


    # ============================================================
    # 8. PROMETHEUS NODE EXPORTER
    # ============================================================

    - name: Install Prometheus Node Exporter
      ansible.builtin.apt:
        name: prometheus-node-exporter
        state: present

    - name: Enable and start Node Exporter
      ansible.builtin.systemd:
        name: prometheus-node-exporter
        enabled: true
        state: started


    # ============================================================
    # 9. ANSIBLE (Jenkins pipeline uses ansible-playbook to deploy)
    # ============================================================

    - name: Install Ansible, Node.js, npm, and pip
      ansible.builtin.apt:
        name:
          - ansible
          - python3-pip
          - nodejs
          - npm
        state: present

    - name: Install community.docker Ansible collection
      ansible.builtin.command:
        cmd: ansible-galaxy collection install community.docker
      become: false
      become_user: jenkins
      changed_when: false

    - name: Verify Ansible
      ansible.builtin.command:
        cmd: ansible --version
      register: ansible_version_output
      changed_when: false

    - name: Display Ansible version
      ansible.builtin.debug:
        msg: "{{ ansible_version_output.stdout_lines[0] }}"


    # ============================================================
    # 9. FINAL JENKINS VERIFICATION
    # ============================================================

    - name: Check Jenkins service
      ansible.builtin.systemd:
        name: jenkins
      register: jenkins_service

    - name: Display Jenkins service status
      ansible.builtin.debug:
        msg: "Jenkins service state: {{ jenkins_service.status.ActiveState }}"

    - name: Display Jenkins initial password location
      ansible.builtin.debug:
        msg: "Run: sudo cat /var/lib/jenkins/secrets/initialAdminPassword"


  # ============================================================
  # HANDLERS
  # ============================================================

  handlers:

    - name: Restart Jenkins
      ansible.builtin.systemd:
        name: jenkins
        state: restarted